spring.datasource.url=${WALLET_DB_URL:jdbc:h2:file:./data/walletapp;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${WALLET_DB_USER:sa}
spring.datasource.password=${WALLET_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${WALLET_DDL_AUTO:update}
spring.flyway.enabled=${WALLET_FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=${WALLET_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jackson.serialization.write-dates-as-timestamps=false
server.port=${PORT:8080}
app.security.jwt-secret=${WALLET_JWT_SECRET}
app.security.jwt-issuer=${WALLET_JWT_ISSUER:wallet-mvp}
app.security.jwt-ttl-minutes=${WALLET_JWT_TTL_MINUTES:30}
app.cors.allowed-origin=${WALLET_CORS_ALLOWED_ORIGIN:https://inawulot999.github.io}
app.demo.allow-self-kyc-approval=${WALLET_DEMO_ALLOW_SELF_KYC_APPROVAL:false}
app.frontend.base-url=${WALLET_FRONTEND_BASE_URL:https://inawulot999.github.io/WalletApp}
app.mail.enabled=${WALLET_SMTP_ENABLED:false}
app.mail.from=${WALLET_SMTP_FROM:}
spring.mail.host=${WALLET_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${WALLET_SMTP_PORT:587}
spring.mail.username=${WALLET_SMTP_USERNAME:}
spring.mail.password=${WALLET_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
