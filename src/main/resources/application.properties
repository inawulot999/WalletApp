spring.datasource.url=${WALLET_DB_URL:jdbc:h2:file:./data/walletapp;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${WALLET_DB_USER:sa}
spring.datasource.password=${WALLET_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${WALLET_DDL_AUTO:update}
spring.flyway.enabled=${WALLET_FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=${WALLET_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jackson.serialization.write-dates-as-timestamps=false
server.port=${PORT:8080}
app.security.jwt-secret=${WALLET_JWT_SECRET}
app.security.jwt-issuer=${WALLET_JWT_ISSUER:wallet-mvp}
app.security.jwt-ttl-minutes=${WALLET_JWT_TTL_MINUTES:30}
app.cors.allowed-origin=${WALLET_CORS_ALLOWED_ORIGIN:https://inawulot999.github.io}
