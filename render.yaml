databases:
  - name: wallet-postgres
    databaseName: wallet
    user: wallet
    region: frankfurt
    plan: free

services:
  - type: web
    name: wallet-api
    runtime: docker
    region: frankfurt
    plan: free
    healthCheckPath: /api/v1/prices/usdt
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wallet-postgres
          property: connectionString
      - key: WALLET_FLYWAY_ENABLED
        value: "true"
      - key: WALLET_DDL_AUTO
        value: validate
      - key: WALLET_JWT_SECRET
        generateValue: true
      - key: WALLET_JWT_ISSUER
        value: wallet-api
      - key: WALLET_CORS_ALLOWED_ORIGIN
        value: https://inawulot999.github.io
